name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Langkah Linting dengan ESLint
      - name: Lint with ESLint
        run: npm run lint --if-present

      # Langkah Unit Testing dengan Jest
      - name: Run unit tests with Jest
        run: npm test -- --watchAll=false
